# Vérifications automatiques à chaque envoi sur GitHub (dont les commits synchronisés par Lovable) :
# types, lint, tests et build. Ne déploie rien.
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Types
        run: bunx tsc --noEmit -p .
      - name: Lint
        run: bunx eslint .
      - name: Tests
        run: bunx vitest run
      - name: Build
        run: bun run build
